name: release

# Trusted-tag release: builds and publishes the image and OCI Helm chart
# to GHCR, emits SBOM/provenance, and signs artifacts via GitHub OIDC
# (keyless cosign) - docs/spec/08-github-actions-and-supply-chain.md.
# Only a real `v*` tag push triggers this - never a PR, so a PR can never
# reach publish/write/id-token permissions. This workflow has been
# authored and packaging tested locally (`docker build`, `helm package`)
# but has NOT yet had an authorized run in this repository - see
# docs/operations.md "Releasing" before trusting it against a real tag.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  GO_VERSION: "1.26.0"
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    name: Build, publish, sign
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only these permissions, only on this job, only on a tag push -
    # docs/spec/08 "Restrict write/id-token permissions to required
    # release jobs."
    permissions:
      contents: write # to attach artifacts to the GitHub Release
      packages: write # to push to GHCR
      id-token: write # for cosign's keyless OIDC signing
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          provenance: true
          sbom: true

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install helm
        run: |
          GOBIN="$(go env GOPATH)/bin" go install helm.sh/helm/v3/cmd/helm@v3.19.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Package and push Helm chart (OCI)
        run: |
          helm registry login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          helm package charts/tenantdeck --version "${{ steps.version.outputs.version }}" --app-version "${{ steps.version.outputs.version }}" -d /tmp/chart-out
          helm push /tmp/chart-out/tenantdeck-${{ steps.version.outputs.version }}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: SBOM (SPDX) for the image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          format: spdx-json
          output-file: sbom.spdx.json

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign the image (keyless, GitHub OIDC)
        run: |
          cosign sign --yes "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

      - name: Attest the SBOM to the image
        run: |
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: sbom.spdx.json
          generate_release_notes: true
