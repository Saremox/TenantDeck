# Disposable session store for the E2E stack only - docs/route-allowlist.md
# "Test infrastructure provisions its own store," not a production
# deployment pattern (no auth/TLS/persistence - see charts/tenantdeck's
# own values.yaml for the production-shaped external-store config this
# is standing in for).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      automountServiceAccountToken: false
      securityContext:
        # valkey/valkey's entrypoint only needs setpriv (not present in the
        # alpine image, so it's not just unnecessary but fatal - "exit code
        # 127, command not found") to drop from root to the image's own
        # valkey user (uid 999, gid 1000). Running as that uid/gid directly
        # skips that step entirely.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          ports:
            - containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
spec:
  selector:
    app: valkey
  ports:
    - port: 6379
      targetPort: 6379
