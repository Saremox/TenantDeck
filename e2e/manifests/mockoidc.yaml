apiVersion: apps/v1
kind: Deployment
metadata:
  name: mockoidc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mockoidc
  template:
    metadata:
      labels:
        app: mockoidc
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mockoidc
          image: mockoidc:e2e
          imagePullPolicy: Never # kind load docker-image, not a registry pull
          ports:
            - containerPort: 9999
          env:
            - name: MOCKOIDC_LISTEN_ADDR
              value: ":9999"
            - name: MOCKOIDC_ISSUER_URL
              value: "http://mockoidc.tenantdeck-e2e.svc.cluster.local:9999"
            - name: MOCKOIDC_CLIENT_ID
              value: "e2e-client"
            - name: MOCKOIDC_CLIENT_SECRET
              value: "e2e-secret"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: mockoidc
spec:
  selector:
    app: mockoidc
  ports:
    - port: 9999
      targetPort: 9999
