{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tenantdeck.serviceAccountName" . }}
  labels:
    {{- include "tenantdeck.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Always false, not a values.yaml knob: TenantDeck never calls the
# Kubernetes API itself (docs/spec/05-upstream-boundary-and-resilience.md
# - every upstream call goes through Capsule Proxy using the caller's own
# session, never an in-cluster credential), so there is nothing a mounted
# token would ever be used for. See
# docs/spec/06-container-and-kubernetes-deployment.md.
automountServiceAccountToken: false
{{- end }}
